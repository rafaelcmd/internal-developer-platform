name: AWS OIDC Login
description: >
  Exchanges the GitHub Actions OIDC token for temporary AWS credentials by
  assuming an IAM role. The repository stores no long-lived AWS access keys.

inputs:
  role-arn:
    description: ARN of the IAM role to assume.
    required: true
  aws-region:
    description: AWS region the credentials are configured for.
    required: true

runs:
  using: composite
  steps:
    # The session name embeds the run id so a CloudTrail event can be traced
    # back to the exact workflow run that produced it.
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: github-actions-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}
