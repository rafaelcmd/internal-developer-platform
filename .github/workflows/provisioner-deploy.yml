name: Provisioner - Deploy to EKS

# Builds the provisioner consumer image and deploys it to the same EKS cluster
# as the API. Terraform prerequisites (IRSA ServiceAccount, SQS queue + SSM
# parameter) come from the provisioner_api stack; telemetry needs the OTel
# Collector Service in-cluster, so in orchestration this runs after
# otel-collector-deploy.

on:
  workflow_dispatch:
  workflow_call: {}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Deploy workflows run kubectl and push images; they assume the deploy
  # role rather than any Terraform component role.
  AWS_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy
  EKS_CLUSTER_NAME: internal-developer-platform-cluster
  SSM_PARAM_NAME: /internal-developer-platform/shared/ecr/internal-developer-platform-repo/repository_url

# One deploy of this workload at a time; never cancel one mid-rollout.
concurrency:
  group: deploy-provisioner
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Provisioner to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch ECR URL from SSM Parameter Store
        run: |
          ECR_URL=$(aws ssm get-parameter \
            --name "${{ env.SSM_PARAM_NAME }}" \
            --query 'Parameter.Value' \
            --output text)
          echo "ECR_URL=$ECR_URL" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=$(echo "$ECR_URL" | cut -d/ -f1)" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push provisioner image
        working-directory: services/provisioner
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.dev \
            -t "$ECR_URL:provisioner-latest" \
            -t "$ECR_URL:provisioner-${{ github.sha }}" \
            .
          docker push "$ECR_URL:provisioner-latest"
          docker push "$ECR_URL:provisioner-${{ github.sha }}"

      # Immutable tag — see api-deploy.yml for the rationale.
      - name: Substitute image in deployment manifest
        run: sed -i "s|PLACEHOLDER-PROVISIONER-IMAGE|${ECR_URL}:provisioner-${{ github.sha }}|g" k8s/provisioner/deployment.yaml

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Apply manifests
        run: kubectl apply -f k8s/provisioner/deployment.yaml

      # The sha-tagged image makes the apply itself trigger the rollout; this
      # just gates the job on it finishing. Fargate scheduling + image pull
      # take a few minutes.
      - name: Wait for rollout
        run: kubectl rollout status deployment/internal-developer-platform-provisioner -n default --timeout=10m
