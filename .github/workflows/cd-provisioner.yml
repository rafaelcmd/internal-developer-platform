# =============================================================================
# PURPOSE   Builds the provisioner (SQS consumer) image, pushes it to ECR and
#           rolls it out on the same EKS cluster as the API.
# TRIGGER   Manual (workflow_dispatch), or called by ops-platform-up.yml.
# AUTH      Shared `github-actions-deploy` role, via OIDC.
# EFFECT    MUTATES the cluster. Replaces the running provisioner pods.
# REQUIRES  The `api` Terraform component, which owns this service's IRSA
#           ServiceAccount and its SQS queue + SSM parameter. Telemetry needs
#           the OTel Collector Service in-cluster, so orchestrated runs deploy
#           the collector first.
# DOCS      .github/workflows/README.md
# =============================================================================

name: CD · Deploy Provisioner → EKS

on:
  workflow_dispatch:
  workflow_call: {}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy
  EKS_CLUSTER_NAME: internal-developer-platform-cluster

# One deploy of this workload at a time, and never cancel one mid-rollout.
concurrency:
  group: deploy-provisioner
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Provisioner to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume AWS role
        uses: ./.github/actions/aws-oidc-login
        with:
          role-arn: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: ./.github/actions/ecr-login
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push image
        working-directory: services/provisioner
        env:
          ECR_URL: ${{ steps.ecr.outputs.repository-url }}
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.dev \
            -t "$ECR_URL:provisioner-latest" \
            -t "$ECR_URL:provisioner-${{ github.sha }}" \
            .
          docker push "$ECR_URL:provisioner-latest"
          docker push "$ECR_URL:provisioner-${{ github.sha }}"

      # Immutable sha tag — see cd-api.yml for why the stable tag is not used.
      - name: Pin image in deployment manifest
        env:
          ECR_URL: ${{ steps.ecr.outputs.repository-url }}
        run: sed -i "s|PLACEHOLDER-PROVISIONER-IMAGE|${ECR_URL}:provisioner-${{ github.sha }}|g" k8s/provisioner/deployment.yaml

      - name: Configure kubectl
        uses: ./.github/actions/eks-kubeconfig
        with:
          cluster-name: ${{ env.EKS_CLUSTER_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply manifests
        run: kubectl apply -f k8s/provisioner/deployment.yaml

      # The sha-tagged image makes the apply itself start the rollout; this
      # step only gates the job on it finishing.
      - name: Wait for rollout
        run: kubectl rollout status deployment/internal-developer-platform-provisioner -n default --timeout=10m
