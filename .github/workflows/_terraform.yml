# =============================================================================
# PURPOSE   The one Terraform pipeline every infra component runs through.
#           Callers pass a component name and an action; all component-specific
#           knowledge (working directory, var-files, post-apply fixups) lives
#           here so the calling workflows stay declarative.
# TRIGGER   workflow_call only. Never runs on its own — see the `ci-*`, `cd-*`
#           and `ops-*` workflows for the entry points.
# AUTH      Per-component IAM role `github-actions-tf-<component>`, assumed via
#           OIDC. Pull request runs instead assume a read-only plan role.
# EFFECT    plan = read-only. apply / destroy = mutates AWS, gated by a
#           deployment environment.
# REQUIRES  Secret TF_API_TOKEN. Secrets DATADOG_API_KEY and
#           DATADOG_APP_KEY_PROV_API for the `datadog` component.
# DOCS      .github/workflows/README.md
# =============================================================================
#
# Why plan and apply are separate jobs: plan writes a binary `tfplan`, uploads
# it as an artifact, and apply executes that exact artifact. What a reviewer
# approved is what runs — apply never re-plans against drifted state.

name: 🔁 Reusable · Terraform Pipeline

on:
  workflow_call:
    inputs:
      component:
        description: "Component: vpc | ecr | datadog | identity | api | api-gateway"
        type: string
        required: true
      action:
        description: "Action: plan | apply | destroy"
        type: string
        required: true
    secrets:
      TF_API_TOKEN:
        required: true
      DATADOG_API_KEY:
        required: false
      DATADOG_APP_KEY_PROV_API:
        required: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Roles are addressed by naming convention (infra/live/shared/iam-github-oidc/
  # roles.tf), so adding a component needs no new repository variable.
  AWS_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-tf-${{ inputs.component }}
  # Terraform ignores TF_VAR_* for variables a configuration doesn't declare,
  # so setting these globally is safe and keeps the keys out of CLI arguments
  # (where they would appear in logs).
  TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
  TF_VAR_datadog_app_key: ${{ secrets.DATADOG_APP_KEY_PROV_API }}

permissions:
  id-token: write # assume the AWS role via OIDC
  contents: read
  pull-requests: write # post the plan as a PR comment

jobs:
  # ---------------------------------------------------------------------------
  # Translates the component name into a directory and var-file flags, and
  # rejects unknown inputs before any credentials are handed out.
  # ---------------------------------------------------------------------------
  params:
    name: Resolve component
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.map.outputs.dir }}
      var_flags: ${{ steps.map.outputs.var_flags }}
    steps:
      - name: Map component to working directory
        id: map
        run: |
          case "${{ inputs.component }}" in
            vpc)         dir=infra/live/shared/vpc ;;
            ecr)         dir=infra/live/shared/ecr ;;
            datadog)     dir=infra/live/shared/datadog ;;
            identity)    dir=infra/live/shared/identity ;;
            api)         dir=infra/live/provisioner_api/dev;         var_flags="-var-file=dev.tfvars" ;;
            api-gateway) dir=infra/live/provisioner_api_gateway/dev; var_flags="-var-file=dev.tfvars" ;;
            scaffolder)  dir=infra/live/scaffolder/dev;              var_flags="-var-file=dev.tfvars" ;;
            *) echo "Unknown component: ${{ inputs.component }}"; exit 1 ;;
          esac
          case "${{ inputs.action }}" in
            plan|apply|destroy) ;;
            *) echo "Unknown action: ${{ inputs.action }}"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "var_flags=${var_flags:-}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Runs for `plan` and as the first half of `apply`.
  #
  # Concurrency (shared by all three jobs below): one Terraform run per
  # component at a time. A second run queues instead of failing on a state-lock
  # timeout, and different components still run in parallel.
  # cancel-in-progress stays false — interrupting a running apply is how
  # half-created infrastructure happens. A queued run whose plan went stale is
  # caught by Terraform's own staleness check at apply time.
  # ---------------------------------------------------------------------------
  plan:
    name: Terraform plan — ${{ inputs.component }}
    if: inputs.action == 'plan' || inputs.action == 'apply'
    needs: [params]
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ inputs.component }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ needs.params.outputs.dir }}
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pull requests get a read-only role: unmerged code must never hold
      # write credentials, and the per-component roles only trust main.
      - name: Assume AWS role
        uses: ./.github/actions/aws-oidc-login
        with:
          role-arn: ${{ github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN || env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # terraform_wrapper intercepts stdout, which would break capturing the
      # plan output to a file below.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init

      # Scoped to this component's own directory tree. Shared modules live
      # outside it, so repo-wide formatting is enforced by the terraform-fmt
      # job in ci-infra-policy.yml.
      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      # `tee` keeps terraform's exit code because bash runs with pipefail here.
      # plan.txt is the human-readable copy used by the PR comment.
      - name: Terraform plan
        run: terraform plan -input=false -no-color ${{ needs.params.outputs.var_flags }} -out=tfplan 2>&1 | tee plan.txt

      # Component-scoped name: one orchestrator run produces several plans
      # within the same workflow run.
      - name: Upload plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ inputs.component }}
          path: |
            ${{ needs.params.outputs.dir }}/tfplan
            ${{ needs.params.outputs.dir }}/plan.txt
          retention-days: 5

      # One comment per component, located again by the HTML marker on the
      # first line so repeated pushes edit it in place instead of stacking.
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tf-plan:${{ inputs.component }} -->';
            const plan = fs.readFileSync('${{ needs.params.outputs.dir }}/plan.txt', 'utf8');
            const body = marker + '\n### Terraform plan — `${{ inputs.component }}`\n\n```\n'
              + plan.slice(-60000) + '\n```';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body.startsWith(marker));
            if (prev) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # ---------------------------------------------------------------------------
  # Executes the plan artifact produced above. Pauses for approval first.
  # ---------------------------------------------------------------------------
  apply:
    name: Terraform apply — ${{ inputs.component }}
    if: inputs.action == 'apply'
    needs: [params, plan]
    runs-on: ubuntu-latest
    # `dev` has a required-reviewer rule, so every apply waits for a human with
    # the plan in view. Repository variable DISABLE_DEPLOYMENT_APPROVALS=true
    # swaps in `dev-auto`, an identical environment with no protection rules,
    # for unattended development cycles. Neither environment carries secrets or
    # variables of its own — the reviewer rule is the only difference — and the
    # deployment is recorded either way.
    #
    # Do not shorten the false branch to an empty string: in `a && b || c`
    # GitHub returns b only when b is truthy, so `... && '' || 'dev'` yields
    # 'dev' in both branches. Both values must be non-empty.
    environment: ${{ vars.DISABLE_DEPLOYMENT_APPROVALS == 'true' && 'dev-auto' || 'dev' }}
    concurrency:
      group: terraform-${{ inputs.component }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ needs.params.outputs.dir }}
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume AWS role
        uses: ./.github/actions/aws-oidc-login
        with:
          role-arn: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      # This is a fresh runner: it needs the providers and modules the saved
      # plan was built against.
      - name: Terraform init
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ inputs.component }}
          path: ${{ needs.params.outputs.dir }}

      - name: Terraform apply (saved plan)
        run: terraform apply -input=false tfplan

      # --- Component-specific post-apply fixups -------------------------------

      # CoreDNS pods created before the Fargate profile exists stay Pending
      # forever; restarting reschedules them onto Fargate.
      - name: Restart CoreDNS onto Fargate
        if: inputs.component == 'api'
        run: |
          aws eks update-kubeconfig --name internal-developer-platform-cluster --region "${{ env.AWS_REGION }}"
          kubectl rollout restart deployment/coredns -n kube-system
          kubectl rollout status deployment/coredns -n kube-system --timeout=5m

      # Mirror the Datadog agent into the private registry so cluster image
      # pulls don't hit public-registry rate limits.
      - name: Mirror Datadog agent image into ECR
        if: inputs.component == 'ecr'
        run: |
          ECR_URL=$(terraform output -raw repository_url)
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_URL
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
          docker pull public.ecr.aws/datadog/agent:latest
          docker tag public.ecr.aws/datadog/agent:latest $ECR_URL:datadog-agent
          docker push $ECR_URL:datadog-agent

  # ---------------------------------------------------------------------------
  # Terraform cannot save and replay a destroy plan the way it can a create
  # plan, so this stays one plan-then-destroy job. Same environment gate and
  # same bypass variable as apply.
  # ---------------------------------------------------------------------------
  destroy:
    name: Terraform destroy — ${{ inputs.component }}
    if: inputs.action == 'destroy'
    needs: [params]
    runs-on: ubuntu-latest
    environment: ${{ vars.DISABLE_DEPLOYMENT_APPROVALS == 'true' && 'dev-auto' || 'dev' }}
    concurrency:
      group: terraform-${{ inputs.component }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ needs.params.outputs.dir }}
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume AWS role
        uses: ./.github/actions/aws-oidc-login
        with:
          role-arn: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init

      # Printed for the run log so the approver can see what is about to go.
      - name: Terraform plan (destroy)
        run: terraform plan -destroy -input=false ${{ needs.params.outputs.var_flags }}

      - name: Terraform destroy
        run: terraform destroy -auto-approve -input=false ${{ needs.params.outputs.var_flags }}
