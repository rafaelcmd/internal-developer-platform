# =============================================================================
# PURPOSE   Build, vet, format-check and test the Go services on every pull
#           request. This is the merge gate for application code, mirroring
#           what ci-infra-plan.yml does for infrastructure.
# TRIGGER   pull_request or push to main touching services/**
# AUTH      None. Nothing here talks to AWS.
# EFFECT    None.
# DOCS      .github/workflows/README.md
# =============================================================================
#
# The two Go services are independent modules, so the matrix runs one job per
# service and a failure in one still reports the other. The scaffolder is .NET
# and gets its own job rather than a matrix entry — the Go matrix is
# Go-specific from setup-go down to gofmt.

name: CI · Services Build & Test

on:
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/ci-services-test.yml"
  push:
    branches: [main]
    paths:
      - "services/**"

# Application CI is read-only, so superseding a run is safe.
concurrency:
  group: services-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, provisioner]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go-version-file keeps the toolchain pinned to each module's go.mod, so
      # bumping Go is a source change rather than a workflow change.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      # Two separate guarantees: `verify` checks the downloaded modules match
      # the recorded checksums, and the `tidy` diff fails if a dependency was
      # added or removed without go.mod/go.sum being regenerated.
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race needs cgo, which is enabled by default on GitHub runners; setting
      # it explicitly keeps the job honest if that default ever changes.
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          echo "### Coverage — ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The scaffolder: .NET, one solution, no AWS and no Docker in the unit tests.
  # The architecture tests in tests/Scaffolder.UnitTests/Architecture run here
  # too, so a layering violation or an unpinned package version fails the PR.
  # ---------------------------------------------------------------------------
  scaffolder:
    name: scaffolder (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scaffolder

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # global-json-file would pin the SDK, but the service does not carry one:
      # Directory.Build.props holds the target framework, and any 10.0 SDK
      # builds it. Keep this in step with the TFM there.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Scaffolder.UnitTests --configuration Release --no-build --collect:"XPlat Code Coverage"

      # Cobertura reports land in a GUID-named directory per run, so the
      # summary globs for the file rather than assuming its path.
      - name: Coverage summary
        run: |
          report=$(find tests/Scaffolder.UnitTests/TestResults -name coverage.cobertura.xml | head -1)
          rate=$(sed -n 's/.*line-rate="\([0-9.]*\)".*/\1/p' "$report" | head -1)
          echo "### Coverage — scaffolder" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "line coverage: $(awk -v r="$rate" 'BEGIN { printf "%.1f%%", r * 100 }')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Advisory for now, in the same spirit as Checkov's soft_fail: the findings
  # are visible on the PR but do not block. Remove continue-on-error once the
  # existing baseline is clean.
  # ---------------------------------------------------------------------------
  lint:
    name: golangci-lint / ${{ matrix.service }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        service: [api, provisioner]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: services/${{ matrix.service }}
