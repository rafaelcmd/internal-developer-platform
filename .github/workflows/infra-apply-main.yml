name: Infra - Apply on merge to main

# Plans and applies the components affected by a push to main. The apply job
# inside terraform.yml is gated by the `dev` environment, so nothing executes
# until the pending deployment is approved with the fresh post-merge plan in
# view. The gate also covers the torn-down case: merging an infra change
# while the stack is destroyed would otherwise re-create it (and its bill) —
# rejecting the deployment is the escape hatch.
#
# Component detection mirrors infra-plan-pr.yml.

on:
  push:
    branches: [main]
    paths:
      - "infra/live/**"
      - "infra/modules/**"

# Serialize merge-triggered applies; never cancel one mid-apply.
concurrency:
  group: infra-apply-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.filter.outputs.changes }}
    steps:
      # push events give paths-filter no base to diff against unless the
      # repo is checked out and a base is named.
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Match changed paths to components
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: main
          filters: |
            vpc:
              - 'infra/live/shared/vpc/**'
              - 'infra/modules/aws/vpc/**'
            ecr:
              - 'infra/live/shared/ecr/**'
              - 'infra/modules/aws/ecr/**'
            datadog:
              - 'infra/live/shared/datadog/**'
              - 'infra/modules/datadog/**'
              - 'infra/modules/aws/datadog_integration/**'
            identity:
              - 'infra/live/shared/identity/**'
              - 'infra/modules/aws/cognito/**'
            api:
              - 'infra/live/provisioner_api/**'
              - 'infra/modules/aws/eks/**'
              - 'infra/modules/aws/sqs/**'
              - 'infra/modules/aws/nlb/**'
            api-gateway:
              - 'infra/live/provisioner_api_gateway/**'
              - 'infra/modules/aws/api_gateway/**'
              - 'infra/modules/aws/waf/**'

  apply:
    name: Apply / ${{ matrix.component }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.detect-changes.outputs.components) }}
    uses: ./.github/workflows/terraform.yml
    with:
      component: ${{ matrix.component }}
      action: apply
    secrets: inherit
