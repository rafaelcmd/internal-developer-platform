name: Orchestrate - Create Full Infrastructure

# Single-click create for the whole platform.
# Order is encoded by `needs:` and matches the SSM-decoupled stack graph:
#
#   shared/vpc ──┐
#   shared/ecr ──┼─▶ shared/datadog
#                │
#                ├─▶ shared/identity
#                │
#                └─▶ provisioner_api/dev ─┬▶ redis-deploy ─────────────▶ api-deploy
#                                         ├▶ otel-collector-deploy ─┬─▶ api-deploy
#                                         │                         └─▶ provisioner-deploy
#                                         └▶ provisioner_api_gateway/dev
# The gateway depends on the Terraform-managed NLB from provisioner_api,
# not on k8s Service reconciliation.

on:
  workflow_dispatch:

# Shared group with orchestrate-destroy: creating and destroying the
# platform must never run at the same time.
concurrency:
  group: orchestrate
  cancel-in-progress: false

# pull-requests: write is required by the reusable terraform.yml (it posts
# plan comments on PRs); a caller granting less than the called workflow
# requests fails the whole run at startup.
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  shared-vpc:
    name: Shared / VPC
    uses: ./.github/workflows/terraform.yml
    with: { component: vpc, action: apply }
    secrets: inherit

  shared-ecr:
    name: Shared / ECR
    uses: ./.github/workflows/terraform.yml
    with: { component: ecr, action: apply }
    secrets: inherit

  shared-datadog:
    name: Shared / Datadog
    needs: [shared-vpc, shared-ecr]
    uses: ./.github/workflows/terraform.yml
    with: { component: datadog, action: apply }
    secrets: inherit

  shared-identity:
    name: Shared / Identity (Cognito)
    needs: [shared-vpc]
    uses: ./.github/workflows/terraform.yml
    with: { component: identity, action: apply }
    secrets: inherit

  provisioner-api:
    name: Provisioner API / EKS + SQS + Redis SSM
    needs: [shared-vpc, shared-ecr, shared-datadog]
    uses: ./.github/workflows/terraform.yml
    with: { component: api, action: apply }
    secrets: inherit

  redis-deploy:
    name: K8s / Redis
    needs: [provisioner-api]
    uses: ./.github/workflows/redis-deploy.yml
    secrets: inherit

  otel-collector-deploy:
    name: K8s / OTel Collector
    # Needs the Terraform-owned prerequisites from provisioner-api: the
    # observability namespace, IRSA ServiceAccount, datadog-api-key secret,
    # and the namespace's Fargate profile.
    needs: [provisioner-api]
    uses: ./.github/workflows/otel-collector-deploy.yml
    secrets: inherit

  api-deploy:
    name: K8s / API
    # shared-identity is required at runtime: the API pod reads the Cognito
    # client_id from SSM at startup and fatals if it's missing.
    # otel-collector-deploy ordering keeps the API from exporting OTLP into
    # the void on a fresh environment (the exporter drops silently).
    needs: [provisioner-api, redis-deploy, otel-collector-deploy, shared-ecr, shared-identity]
    uses: ./.github/workflows/api-deploy.yml
    secrets: inherit

  provisioner-deploy:
    name: K8s / Provisioner
    # provisioner-api owns the Terraform prerequisites (IRSA ServiceAccount,
    # SQS queue + SSM parameter); otel-collector-deploy ordering keeps the
    # consumer from exporting OTLP into the void on a fresh environment.
    needs: [provisioner-api, otel-collector-deploy, shared-ecr]
    uses: ./.github/workflows/provisioner-deploy.yml
    secrets: inherit

  provisioner-api-gateway:
    name: Provisioner API Gateway / API Gateway + WAF
    needs: [provisioner-api, shared-identity]
    uses: ./.github/workflows/terraform.yml
    with: { component: api-gateway, action: apply }
    secrets: inherit
