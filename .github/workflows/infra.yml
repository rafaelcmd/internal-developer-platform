name: Infra - Terraform

# Manual entry point for a single infra component: pick a component and
# plan/apply/destroy. The pipeline itself lives in the reusable
# terraform.yml; apply and destroy pause at the `dev` environment gate.
# Full-platform runs go through orchestrate-create / orchestrate-destroy.

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to operate on
        required: true
        type: choice
        options:
          - vpc
          - ecr
          - datadog
          - identity
          - api
          - api-gateway
      action:
        description: Terraform action
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: ${{ inputs.action }} / ${{ inputs.component }}
    uses: ./.github/workflows/terraform.yml
    with:
      component: ${{ inputs.component }}
      action: ${{ inputs.action }}
    secrets: inherit
