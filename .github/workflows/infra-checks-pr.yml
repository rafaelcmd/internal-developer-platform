name: Infra - Checks on PR

# Policy and cost gates for infrastructure pull requests, complementing the
# terraform plan posted by infra-plan-pr.yml: Checkov scans the HCL for
# security misconfigurations (findings land in the PR checks and the
# repository's Security tab via SARIF), and Infracost comments the monthly
# cost delta of the change.
#
# Checkov runs with soft_fail while the baseline is triaged — findings are
# visible but don't block merges. Flip soft_fail to false (or enforce
# selected checks with --check) once the noise is addressed.
#
# Infracost needs the INFRACOST_API_KEY repository secret (free API key from
# infracost.io). Both tools parse HCL statically: no cloud credentials, so
# no OIDC role and no id-token permission here.
#
# Repository variable DISABLE_BRANCH_TRIGGERS=true short-circuits both jobs;
# see infra-plan-pr.yml for why the guard sits on the jobs and not on `on:`.

on:
  pull_request:
    paths:
      - "infra/live/**"
      - "infra/modules/**"

concurrency:
  group: infra-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  checkov:
    name: Checkov security scan
    if: vars.DISABLE_BRANCH_TRIGGERS != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: infra
          framework: terraform
          quiet: true
          soft_fail: true
          # Checkov writes results.sarif to the working directory when the
          # output format is sarif; the upload step below consumes it.
          output_format: sarif

      - name: Upload findings to Security tab
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          sarif_file: results.sarif

  infracost:
    name: Infracost cost estimate
    if: vars.DISABLE_BRANCH_TRIGGERS != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Infracost
        uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The config file may not exist on the base branch yet; carrying the
      # PR's copy across both checkouts keeps the baseline and diff comparable.
      - name: Stash Infracost config
        run: cp infracost.yml /tmp/infracost.yml

      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Generate cost baseline from base branch
        run: |
          cp /tmp/infracost.yml ./infracost.yml
          infracost breakdown --config-file=infracost.yml \
            --format=json --out-file=/tmp/infracost-base.json

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate cost diff
        run: |
          infracost diff --config-file=infracost.yml \
            --compare-to=/tmp/infracost-base.json \
            --format=json --out-file=/tmp/infracost.json

      # behavior=update keeps a single comment per PR, edited in place.
      #
      # Non-blocking for the same reason Checkov soft-fails: Infracost Cloud
      # governance checks (the default FinOps tag policy) exit non-zero after
      # the comment is posted, and the cost estimate is advisory while the
      # tagging baseline is unresolved. Disable the policy in Infracost Cloud
      # to silence it at the source, or drop this line to enforce it.
      - name: Post cost comment on PR
        continue-on-error: true
        run: |
          infracost comment github --path=/tmp/infracost.json \
            --repo=${{ github.repository }} \
            --pull-request=${{ github.event.pull_request.number }} \
            --github-token=${{ github.token }} \
            --behavior=update
