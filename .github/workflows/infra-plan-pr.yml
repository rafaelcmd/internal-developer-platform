name: Infra - Plan on PR

# Runs `terraform plan` for every component a pull request touches and posts
# each plan as a PR comment (via the reusable terraform.yml), so infra PRs
# are reviewed against the real diff rather than the HCL alone.
#
# paths-filter matches the PR's changed files against the per-component
# lists below and outputs the matching filter names as a JSON array, which
# feeds the matrix — only affected components are planned. A shared module
# can appear in several components' lists; editing it plans every consumer.
#
# These runs authenticate with the read-only plan role, so a pull request
# can read AWS to compute the diff but can never mutate it.
#
# Repository variable DISABLE_BRANCH_TRIGGERS=true short-circuits the run:
# `on:` can't read the vars context, so the workflow still starts and every
# job skips immediately. Plans are meaningless while the stack is destroyed,
# which is most of the time during development.

on:
  pull_request:
    paths:
      - "infra/live/**"
      - "infra/modules/**"

# One group per PR; a new push cancels the previous run — a superseded
# commit's plan is worthless, and plans are read-only so cancelling is safe.
concurrency:
  group: infra-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    name: Detect affected components
    # Skipping this job skips `plan` too — it `needs` this one.
    if: vars.DISABLE_BRANCH_TRIGGERS != 'true'
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Match changed paths to components
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            vpc:
              - 'infra/live/shared/vpc/**'
              - 'infra/modules/aws/vpc/**'
            ecr:
              - 'infra/live/shared/ecr/**'
              - 'infra/modules/aws/ecr/**'
            datadog:
              - 'infra/live/shared/datadog/**'
              - 'infra/modules/datadog/**'
              - 'infra/modules/aws/datadog_integration/**'
            identity:
              - 'infra/live/shared/identity/**'
              - 'infra/modules/aws/cognito/**'
            api:
              - 'infra/live/provisioner_api/**'
              - 'infra/modules/aws/eks/**'
              - 'infra/modules/aws/sqs/**'
              - 'infra/modules/aws/nlb/**'
            api-gateway:
              - 'infra/live/provisioner_api_gateway/**'
              - 'infra/modules/aws/api_gateway/**'
              - 'infra/modules/aws/waf/**'

  plan:
    name: Plan / ${{ matrix.component }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.detect-changes.outputs.components) }}
    uses: ./.github/workflows/terraform.yml
    with:
      component: ${{ matrix.component }}
      action: plan
    secrets: inherit
